name: Fork build

# Tests, Python wheels and standalone CLI binaries for this fork. Runs on every
# push to `daily`; pushing a `v*` tag also attaches everything to a GitHub
# release on the fork. Nothing is published to PyPI.

on:
  push:
    branches: [daily]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SKIP_INTEGRATION_TESTS: yes

jobs:
  test:
    name: Test (indra-ocr)
    runs-on: ubuntu-24.04
    env:
      # ONNX Runtime's static library needs GCC 14's libstdc++.
      CC: gcc-14
      CXX: g++-14
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc-14
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev gcc-14 g++-14

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pdfium-rs
            target
          key: ${{ runner.os }}-cargo-fork-test-${{ hashFiles('**/Cargo.lock') }}

      - run: cargo test -p liteparse --features indra-ocr-auto-download --locked

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    name: Wheel ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica

      - name: Force Ninja generator (Windows)
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
        shell: bash

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pdfium-rs
            ~/Library/Caches/pdfium-rs
            ${{ runner.os == 'Windows' && format('{0}\pdfium-rs', env.LOCALAPPDATA) || '' }}
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-fork-wheel-${{ hashFiles('**/Cargo.lock') }}

      - name: Stage pdfium for wheel inclusion
        if: ${{ !matrix.musl }}
        shell: bash
        run: bash packages/python/scripts/download-pdfium.sh ${{ matrix.target }}

      - name: Build wheel (glibc)
        if: ${{ !matrix.musl }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: 2_28
          working-directory: packages/python
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y tesseract-devel leptonica-devel openssl-devel pkgconfig perl-IPC-Cmd || true
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y libtesseract-dev libleptonica-dev libssl-dev pkg-config || true
            elif command -v apk &> /dev/null; then
              apk add tesseract-ocr-dev leptonica-dev openssl-dev pkgconf || true
            fi

      - name: Build wheel (musl container)
        if: ${{ matrix.musl }}
        run: |
          chmod +x scripts/build-musl-py.sh
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            -v "$HOME/.cargo/git":/root/.cargo/git \
            -v "$HOME/.cache/pdfium-rs":/root/.cache/pdfium-rs \
            -w /work \
            python:3.12-alpine \
            /work/scripts/build-musl-py.sh
          sudo chmod -R a+rw packages/python/dist/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: packages/python/dist/*.whl
          if-no-files-found: error

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: packages/python

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: packages/python/dist/*.tar.gz
          if-no-files-found: error

  test-wheels:
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    name: Test wheel ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

      - run: pip install --no-index --find-links dist liteparse

      - name: Parse test
        run: |
          python -c "
          from liteparse import LiteParse
          parser = LiteParse(ocr_enabled=False, quiet=True, max_pages=2)
          result = parser.parse('demo/docs/apple-10k-2024.pdf')
          assert result.num_pages == 2, f'Expected 2 pages, got {result.num_pages}'
          assert len(result.text) > 0, 'Expected non-empty text'
          print(f'Parsed {result.num_pages} pages, {len(result.text)} chars')
          "

      - name: CLI test
        run: |
          liteparse --version
          liteparse parse demo/docs/apple-10k-2024.pdf --no-ocr --max-pages 1 -q | head -5

  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONNX Runtime's prebuilt static library needs glibc 2.38 and GCC 14's
          # libstdc++, so the Indra builds target current distros...
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            name: linux-x64
            features: indra-ocr-auto-download
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: linux-arm64
            features: indra-ocr-auto-download
          # ...and the compat builds keep the glibc 2.31 baseline, Tesseract only.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            name: linux-x64-compat
            features: ""
            glibc-container: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            name: linux-arm64-compat
            features: ""
            glibc-container: true
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
            features: indra-ocr-auto-download
          # ONNX Runtime has no prebuilt binaries for Intel macOS, so this
          # build has Tesseract only.
          - target: x86_64-apple-darwin
            os: macos-26-intel
            name: macos-x64
            features: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x64
            features: indra-ocr-auto-download
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            name: windows-arm64
            features: indra-ocr-auto-download
    runs-on: ${{ matrix.os }}
    name: CLI ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.glibc-container
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev gcc-14 g++-14
          target_env=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CC=gcc-14" >> $GITHUB_ENV
          echo "CXX=g++-14" >> $GITHUB_ENV
          echo "CARGO_TARGET_${target_env}_LINKER=gcc-14" >> $GITHUB_ENV

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica

      - name: Force Ninja generator (Windows)
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
        shell: bash

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pdfium-rs
            ~/Library/Caches/pdfium-rs
            ${{ runner.os == 'Windows' && format('{0}\pdfium-rs', env.LOCALAPPDATA) || '' }}
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-fork-cli-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        if: ${{ !matrix.glibc-container }}
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p liteparse ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Build (glibc 2.31 container)
        if: ${{ matrix.glibc-container }}
        run: |
          chmod +x scripts/build-glibc-cli.sh
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            -v "$HOME/.cargo/git":/root/.cargo/git \
            -v "$HOME/.cache/pdfium-rs":/root/.cache/pdfium-rs \
            -w /work \
            node:20-bullseye \
            /work/scripts/build-glibc-cli.sh ${{ matrix.target }} "${{ matrix.features }}"
          sudo chmod -R a+rwX target || true

      # PDFium is loaded at runtime, so it ships next to the binary.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name=liteparse-${{ matrix.name }}
          out=target/${{ matrix.target }}/release
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = Windows ]; then exe=liteparse.exe; else exe=liteparse; fi
          cp "$out/$exe" LICENSE "dist/$name/"
          for lib in libpdfium.so libpdfium.dylib pdfium.dll; do
            if [ -f "$out/deps/$lib" ]; then cp "$out/deps/$lib" "dist/$name/"; fi
          done
          ls dist/$name | grep -q pdfium || { echo "::error::pdfium library not found in $out/deps"; exit 1; }
          if [ "$RUNNER_OS" = Linux ]; then
            echo "Needs glibc $(objdump -T "dist/$name/$exe" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)"
          fi
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/liteparse-${{ matrix.name }}.*
          if-no-files-found: error

  # Runs the packaged CLI on a clean runner, so PDFium has to come from the
  # archive and OCR models from the first-use download.
  test-cli:
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: ubuntu-22.04, name: linux-x64-compat }
          - { os: ubuntu-22.04-arm, name: linux-arm64-compat }
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-26-intel, name: macos-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: windows-11-arm, name: windows-arm64 }
    runs-on: ${{ matrix.os }}
    name: Test CLI ${{ matrix.name }}
    env:
      INDRA_OCR_HOME: ${{ github.workspace }}/../indra-models
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: demo/docs

      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: archive

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../indra-models
          key: indra-models-v1.1.0

      - name: Unpack
        shell: bash
        run: |
          cd archive
          if [ "$RUNNER_OS" = Windows ]; then 7z x ./*.zip > /dev/null; else tar -xzf ./*.tar.gz; fi
          ls -la liteparse-${{ matrix.name }}

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin=archive/liteparse-${{ matrix.name }}/liteparse
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" parse demo/docs/apple-10k-2024.pdf --no-ocr --max-pages 1 -q | head -5
          "$bin" parse demo/docs/long_tiny_text.pdf --max-pages 1 -q -o ocr-out.txt
          size=$(wc -c < ocr-out.txt)
          echo "OCR output: $size bytes"
          head -c 300 ocr-out.txt; echo
          test "$size" -gt 200

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-wheels, build-sdist, test-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
